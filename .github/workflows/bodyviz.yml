name: bodyviz

on:
  push:
    branches: [main]
    paths:
      - "PeakPerformanceDataMarketing/ThreeJS/**"
      - ".github/workflows/bodyviz.yml"
  pull_request:
    branches: [main]
    paths:
      - "PeakPerformanceDataMarketing/ThreeJS/**"
      - ".github/workflows/bodyviz.yml"

defaults:
  run:
    working-directory: PeakPerformanceDataMarketing/ThreeJS

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: PeakPerformanceDataMarketing/ThreeJS/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Run tests
        run: pnpm turbo test

      - name: Build demo
        run: pnpm --filter demo build

      - name: Build gallery
        run: pnpm --filter @bodyviz/gallery build
